build:
  show: true
  script: |
    set -euo pipefail

    echo "==> Building Svelte frontend..."
    cd web && npm run build && cd ..
    rm -rf internal/web/dist
    cp -r web/dist internal/web/dist

    echo "==> Building Go binary..."
    COMMIT=$(git rev-parse --short HEAD 2>/dev/null || echo "dev")
    go build -ldflags="-s -w -X main.version=$COMMIT -X github.com/quonaro/gnostis/internal/mcp.version=$COMMIT" -o gnostis ./cmd/gnostis

    echo "==> Build complete: ./gnostis"

dev:
  desc: Run gnostis with live reload
  script: echo "Start development"
  vars:
  - "import:env .env"
  parallel: true
  depends:
  - backend-dev
  - frontend-dev

backend-dev:
  vars:
  - "import:env .env"
  show: false
  script: air

frontend-dev:
  show: false
  script: npm run dev
  dir: web

push:
  desc: Build, lint, commit, and push to GitHub
  color: cyan
  args:
  - "tag:str?"
  script: |
    set -euo pipefail

    echo "==> Building..."
    lota build

    echo "==> Running pre-commit checks..."
    pre-commit run --all-files || true

    if [ -n "$(git status --porcelain)" ]; then
      echo "==> Committing changes from build and lint..."
      git add -A
      git commit -m "chore: pre-push build and lint fixes"
    fi

    echo "==> Verifying pre-commit passes clean..."
    pre-commit run --all-files

    if [ -n "${tag:-}" ]; then
      git tag -f "$tag"
      git push origin "$tag" --force
      git push
    else
      git push origin main
    fi
