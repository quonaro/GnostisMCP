build:
  show: true
  script: |
    set -euo pipefail

    echo "==> Building Svelte frontend..."
    cd web && npm run build && cd ..
    rm -rf internal/web/dist
    cp -r web/dist internal/web/dist

    echo "==> Building Go binary..."
    COMMIT=$(git rev-parse --short HEAD 2>/dev/null || echo "dev")
    go build -ldflags="-s -w -X main.version=$COMMIT -X github.com/quonaro/gnostis/internal/mcp.version=$COMMIT" -o gnostis ./cmd/gnostis

    echo "==> Build complete: ./gnostis"

dev:
  desc: Run gnostis with live reload
  script: echo "Start development"
  vars:
  - "import:env .env"
  parallel: true
  depends:
  - backend-dev
  - frontend-dev

backend-dev:
  vars:
  - "import:env .env"
  show: false
  script: air

frontend-dev:
  show: false
  script: npm run dev
  dir: web

push:
  desc: Push to GitHub
  color: cyan
  args:
  - "tag:str?"
  script: |
    if [ -n $tag ]; then
      git tag -f $tag
      git push origin $tag --force
      git push
    else
      git push origin main
    fi

service:
  install:
    depends:
    - "build"
    script: |
      systemctl --user stop gnostis && ./gnostis install && systemctl --user start gnostis
  stop:
    script: |
      systemctl --user stop gnostis
  start:
    script: |
      systemctl --user start gnostis
