name: CI

on:
  push:
    tags:
    - 'v*'
  pull_request:
    branches:
    - main

jobs:
  test:
    name: Test and build
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-go@v5
      with:
        go-version: '1.26'

    - name: Test
      run: go test ./...

    - name: Build
      run: go build ./cmd/gnostis
